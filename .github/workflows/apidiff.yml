name: PR API diff

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  api-diff:
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/api-diff' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: windows-latest

    steps:
      - name: Get pull request references
        id: pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.eventName === 'pull_request_target'
              ? context.payload.pull_request.number
              : context.payload.issue.number;

            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber
            });

            core.setOutput('number', pullRequest.data.number);
            core.setOutput('head_sha', pullRequest.data.head.sha);
            core.setOutput('base_sha', pullRequest.data.base.sha);

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install generator
        run: dotnet tool install --global dotMorten.OmdGenerator

      - name: Generate API diff
        shell: bash
        run: |
          generateomd \
            --source=src/WinUIEx/WinUIEx.csproj \
            --gitRepo=${{ github.server_url }}/${{ github.repository }} \
            --sourceRef=${{ steps.pull_request.outputs.head_sha }} \
            --compareRef=${{ steps.pull_request.outputs.base_sha }} \
            --format=md \
            --output=api-diff

      - name: Check whether API changes were found
        id: api_diff
        shell: bash
        run: |
          if grep -q '^namespace ' api-diff.md; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR comment
        uses: actions/github-script@v7
        env:
          COMMENT_MARKER: <!-- dotnet-omd-api-diff -->
          HAS_CHANGES: ${{ steps.api_diff.outputs.has_changes }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = process.env.COMMENT_MARKER;
            const hasChanges = process.env.HAS_CHANGES === 'true';
            const diff = fs.readFileSync('api-diff.md', 'utf8').trim();
            
            const { owner, repo } = context.repo;
            const issue_number = Number('${{ steps.pull_request.outputs.number }}');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker));

            if (!hasChanges && !existing) {
              return;
            }

            const body = hasChanges
              ? [
                  marker,
                  '## API changes',
                  '',
                  diff
                ].join('\n')
              : [
                  marker,
                  '## API changes',
                  '',
                  'No API changes are currently detected in this pull request.'
                ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
